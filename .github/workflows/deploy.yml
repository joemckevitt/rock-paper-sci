name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer merge waits for the running deploy to finish
concurrency:
  group: render-deploy
  cancel-in-progress: false

env:
  RENDER_SERVICE_ID: srv-dc25uvtg1s2s7392lnig

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy commit and wait for it to go live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          api=https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys
          auth="Authorization: Bearer $RENDER_API_KEY"

          curl -sf -X POST "$api" -H "$auth" -H "Content-Type: application/json" \
            -d "{\"commitId\":\"$GITHUB_SHA\"}" > /dev/null
          echo "Requested deploy of ${GITHUB_SHA:0:7}"

          # Track the newest deploy of this commit rather than the ID from the POST:
          # Render returns no ID when it queues the deploy behind another one, and a
          # render.yaml change starts its own deploy of the same commit.
          for _ in $(seq 1 60); do
            read -r deploy_id status < <(curl -sf "$api?limit=10" -H "$auth" | jq -r \
              '[.[].deploy | select(.commit.id == env.GITHUB_SHA)][0] // {} | "\(.id) \(.status // "pending")"')
            echo "$deploy_id $status"
            case $status in
              live) exit 0 ;;
              *failed|canceled|deactivated) exit 1 ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for deploy" >&2
          exit 1
