name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer merge waits for the running deploy to finish
concurrency:
  group: render-deploy
  cancel-in-progress: false

env:
  RENDER_SERVICE_ID: srv-dc25uvtg1s2s7392lnig

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy commit and wait for it to go live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          api=https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys
          auth="Authorization: Bearer $RENDER_API_KEY"

          deploy_id=$(curl -sf -X POST "$api" -H "$auth" -H "Content-Type: application/json" \
            -d "{\"commitId\":\"$GITHUB_SHA\"}" | jq -r .id)
          echo "Started deploy $deploy_id for ${GITHUB_SHA:0:7}"

          for _ in $(seq 1 60); do
            status=$(curl -sf "$api/$deploy_id" -H "$auth" | jq -r .status)
            echo "$status"
            case $status in
              live) exit 0 ;;
              *failed|canceled|deactivated) exit 1 ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for deploy" >&2
          exit 1
