services:
  - type: web
    name: rps-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    # Deploys are triggered by the GitHub Action on merge to main, or from
    # the command line with `npm run deploy`
    autoDeploy: false
    envVars:
      # Render sits behind a proxy; rate limit on the real client IP
      - key: TRUST_PROXY
        value: "true"
